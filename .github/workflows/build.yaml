name: build

# ------------- NOTE
# please setup some secrets before running this workflow:
# DOCKER_IMAGE should be the target image name on docker hub (e.g. "rustdesk/rustdesk-server-s6" )
# DOCKER_IMAGE_CLASSIC should be the target image name on docker hub for the old build (e.g. "rustdesk/rustdesk-server" )
# DOCKER_HUB_USERNAME is the username you normally use to login at https://hub.docker.com/
# DOCKER_HUB_PASSWORD is a token you should create under "account settings / security" with read/write access

permissions:
  contents: read
  packages: write
  actions: write

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    paths-ignore:
      - '.github/**'
      - 'README*.md'
      - 'docs/**'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-[0-9]+'

env:
  CARGO_TERM_COLOR: always
  LATEST_TAG: latest
  DOCKER_IMAGE: ${{ secrets.DOCKER_IMAGE || format('{0}/rustdesk-server-s6', secrets.DOCKER_HUB_USERNAME || secrets.DOCKER_USERNAME || github.repository_owner) }}
  DOCKER_IMAGE_CLASSIC: ${{ secrets.DOCKER_IMAGE_CLASSIC || format('{0}/rustdesk-server', secrets.DOCKER_HUB_USERNAME || secrets.DOCKER_USERNAME || github.repository_owner) }}
  
jobs:

  # binary build
  build:

    name: Build - ${{ matrix.job.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   target: "x86_64-unknown-linux-musl" }
          - { name: "arm64v8", target: "aarch64-unknown-linux-musl" }
          - { name: "armv7",   target: "armv7-unknown-linux-musleabihf" }
          #- { name: "i386",    target: "i686-unknown-linux-musl" }
          #- { name: "amd64fb",    target: "x86_64-unknown-freebsd" }

    steps:
      
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Install toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          default: true
          components: rustfmt
          profile: minimal
          target: ${{ matrix.job.target }}

      - name: Build
        uses: actions-rs/cargo@v1
        with:
          command: build
          args: --release --target=${{ matrix.job.target }}
          use-cross: true  

      - name: Exec chmod
        run: chmod -v a+x target/${{ matrix.job.target }}/release/*

      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: |
            target/${{ matrix.job.target }}/release/hbbr
            target/${{ matrix.job.target }}/release/hbbs
            target/${{ matrix.job.target }}/release/rustdesk-utils
          if-no-files-found: error
          retention-days: 1

  build-api:
    name: Build API - ${{ matrix.job.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   goarch: "amd64", goarm: "",  platform: "amd64" }
          - { name: "arm64v8", goarch: "arm64", goarm: "",  platform: "arm64" }
          - { name: "armv7",   goarch: "arm",   goarm: "7", platform: "armv7l" }
    steps:
      - name: Checkout API
        uses: actions/checkout@v4
        with:
          repository: Marukon/rustdesk-api
          path: rustdesk-api
          ref: master

      - name: Checkout Web Frontend
        uses: actions/checkout@v4
        with:
          repository: Marukon/rustdesk-api-web
          path: rustdesk-api/rustdesk-api-web
          ref: master

      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Web Frontend
        working-directory: rustdesk-api/rustdesk-api-web
        run: |
          npm install
          npm run build
          mkdir -p ../resources/admin/
          cp -ar dist/* ../resources/admin/

      - name: Build Go API binary
        working-directory: rustdesk-api
        run: |
          go mod tidy
          go install github.com/swaggo/swag/cmd/swag@latest
          swag init -g cmd/apimain.go --output docs/api --instanceName api --exclude http/controller/admin
          swag init -g cmd/apimain.go --output docs/admin --instanceName admin --exclude http/controller/api
          mkdir -p release/data release/runtime
          touch release/data/.gitkeep release/runtime/.gitkeep
          cp -ar resources release/
          cp -ar docs release/
          cp -ar conf release/
          if [ "${{ matrix.job.platform }}" = "arm64" ]; then
              wget -q https://musl.ljw.red/aarch64-linux-musl-cross.tgz
              tar -xf aarch64-linux-musl-cross.tgz
              export PATH=$PATH:$PWD/aarch64-linux-musl-cross/bin
              GOOS=linux GOARCH=${{ matrix.job.goarch }} CC=aarch64-linux-musl-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 go build -ldflags "-s -w" -o ./release/apimain ./cmd/apimain.go
          elif [ "${{ matrix.job.platform }}" = "armv7l" ]; then
              wget -q https://musl.ljw.red/armv7l-linux-musleabihf-cross.tgz
              tar -xf armv7l-linux-musleabihf-cross.tgz
              export PATH=$PATH:$PWD/armv7l-linux-musleabihf-cross/bin
              GOOS=linux GOARCH=${{ matrix.job.goarch }} GOARM=${{ matrix.job.goarm }} CC=armv7l-linux-musleabihf-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 go build -ldflags "-s -w" -o ./release/apimain ./cmd/apimain.go
          else
              sudo apt-get install musl musl-dev musl-tools -y
              GOOS=linux GOARCH=${{ matrix.job.goarch }} CC=musl-gcc CGO_LDFLAGS="-static" CGO_ENABLED=1 go build -ldflags "-s -w" -o ./release/apimain ./cmd/apimain.go
          fi

      - name: Upload API Artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-${{ matrix.job.name }}
          path: rustdesk-api/release
          retention-days: 1

  # docker build and push of single-arch images
  docker:

    name: Docker push - ${{ matrix.job.name }}
    needs: [build, build-api]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   docker_platform: "linux/amd64",  s6_platform: "x86_64" }
          - { name: "arm64v8", docker_platform: "linux/arm64",  s6_platform: "aarch64" }
          - { name: "armv7",   docker_platform: "linux/arm/v7", s6_platform: "armhf" }
#          - { name: "i386",    docker_platform: "linux/386",    s6_platform: "i686" }

    steps:

      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
        
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: docker/rootfs/usr/bin

      - name: Download API release
        uses: actions/download-artifact@v4
        with:
          name: api-${{ matrix.job.name }}
          path: docker/api_app

      - name: Make binaries executable
        run: |
          chmod -v a+x docker/rootfs/usr/bin/*
          chmod -v a+x docker/api_app/apimain

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD || secrets.DOCKER_ACCESS_TOKEN }}
        
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: registry.hub.docker.com/${{ env.DOCKER_IMAGE }}

      - name: Get git tag
        id: vars
        run: |
          T=${GITHUB_REF#refs/*/}
          M=${T%%.*}
          echo "GIT_TAG=$T" >> $GITHUB_ENV
          echo "MAJOR_TAG=$M" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: "./docker"
          platforms: ${{ matrix.job.docker_platform }}
          push: true
          provenance: false
          build-args: |
            S6_ARCH=${{ matrix.job.s6_platform }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ env.LATEST_TAG }}-${{ matrix.job.name }}
            ${{ env.DOCKER_IMAGE }}:${{ env.GIT_TAG }}-${{ matrix.job.name }}
            ${{ env.DOCKER_IMAGE }}:${{ env.MAJOR_TAG }}-${{ matrix.job.name }}
          labels: ${{ steps.meta.outputs.labels }}

  # docker build and push of multiarch images
  docker-manifest:

    name: Docker manifest s6
    needs: docker
    runs-on: ubuntu-24.04

    steps:

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD || secrets.DOCKER_ACCESS_TOKEN }}

      - name: Get git tag
        id: vars
        run: |
          T=${GITHUB_REF#refs/*/}
          M=${T%%.*}
          echo "GIT_TAG=$T" >> $GITHUB_ENV
          echo "MAJOR_TAG=$M" >> $GITHUB_ENV

      # manifest for :1.2.3 tag
      #  this has to run only if invoked by a new tag
      - name: Create and push manifest (:ve.rs.ion)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_IMAGE }}:${{ env.GIT_TAG }} \
            ${{ env.DOCKER_IMAGE }}:${{ env.GIT_TAG }}-amd64 \
            ${{ env.DOCKER_IMAGE }}:${{ env.GIT_TAG }}-arm64v8 \
            ${{ env.DOCKER_IMAGE }}:${{ env.GIT_TAG }}-armv7

      # manifest for :1 tag (major release)
      - name: Create and push manifest (:major)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_IMAGE }}:${{ env.MAJOR_TAG }} \
            ${{ env.DOCKER_IMAGE }}:${{ env.MAJOR_TAG }}-amd64 \
            ${{ env.DOCKER_IMAGE }}:${{ env.MAJOR_TAG }}-arm64v8 \
            ${{ env.DOCKER_IMAGE }}:${{ env.MAJOR_TAG }}-armv7

      # manifest for :latest tag
      - name: Create and push manifest (:latest)
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_IMAGE }}:${{ env.LATEST_TAG }} \
            ${{ env.DOCKER_IMAGE }}:${{ env.LATEST_TAG }}-amd64 \
            ${{ env.DOCKER_IMAGE }}:${{ env.LATEST_TAG }}-arm64v8 \
            ${{ env.DOCKER_IMAGE }}:${{ env.LATEST_TAG }}-armv7

            
  # docker build and push of single-arch images
  docker-classic:

    name: Docker push classic - ${{ matrix.job.name }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - { name: "amd64",   docker_platform: "linux/amd64" }
          - { name: "arm64v8", docker_platform: "linux/arm64" }
          - { name: "armv7",   docker_platform: "linux/arm/v7" }

    steps:

      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
        
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: binaries-linux-${{ matrix.job.name }}
          path: docker-classic/

      - name: Make binaries executable
        run: chmod -v a+x docker-classic/*

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD || secrets.DOCKER_ACCESS_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: registry.hub.docker.com/${{ env.DOCKER_IMAGE_CLASSIC }}

      - name: Get git tag
        id: vars
        run: |
          T=${GITHUB_REF#refs/*/}
          M=${T%%.*}
          echo "GIT_TAG=$T" >> $GITHUB_ENV
          echo "MAJOR_TAG=$M" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: "./docker-classic"
          platforms: ${{ matrix.job.docker_platform }}
          push: true
          provenance: false
          tags: |
            ${{ env.DOCKER_IMAGE_CLASSIC }}:${{ env.LATEST_TAG }}-${{ matrix.job.name }}
            ${{ env.DOCKER_IMAGE_CLASSIC }}:${{ env.GIT_TAG }}-${{ matrix.job.name }}
            ${{ env.DOCKER_IMAGE_CLASSIC }}:${{ env.MAJOR_TAG }}-${{ matrix.job.name }}
          labels: ${{ steps.meta.outputs.labels }}

  # docker build and push of multiarch images
  docker-manifest-classic:

    name: Docker manifest classic
    needs: docker-classic
    runs-on: ubuntu-24.04
    steps:

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD || secrets.DOCKER_ACCESS_TOKEN }}

      - name: Get git tag
        id: vars
        run: |
          T=${GITHUB_REF#refs/*/}
          M=${T%%.*}
          echo "GIT_TAG=$T" >> $GITHUB_ENV
          echo "MAJOR_TAG=$M" >> $GITHUB_ENV

      # manifest for :1.2.3 tag
      #  this has to run only if invoked by a new tag
      - name: Create and push manifest (:ve.rs.ion)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_IMAGE_CLASSIC }}:${{ env.GIT_TAG }} \
            ${{ env.DOCKER_IMAGE_CLASSIC }}:${{ env.GIT_TAG }}-amd64 \
            ${{ env.DOCKER_IMAGE_CLASSIC }}:${{ env.GIT_TAG }}-arm64v8 \
            ${{ env.DOCKER_IMAGE_CLASSIC }}:${{ env.GIT_TAG }}-armv7

      # manifest for :1 tag (major release)
      - name: Create and push manifest (:major)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_IMAGE_CLASSIC }}:${{ env.MAJOR_TAG }} \
            ${{ env.DOCKER_IMAGE_CLASSIC }}:${{ env.MAJOR_TAG }}-amd64 \
            ${{ env.DOCKER_IMAGE_CLASSIC }}:${{ env.MAJOR_TAG }}-arm64v8 \
            ${{ env.DOCKER_IMAGE_CLASSIC }}:${{ env.MAJOR_TAG }}-armv7

      # manifest for :latest tag
      - name: Create and push manifest (:latest)
        run: |
          docker buildx imagetools create -t ${{ env.DOCKER_IMAGE_CLASSIC }}:${{ env.LATEST_TAG }} \
            ${{ env.DOCKER_IMAGE_CLASSIC }}:${{ env.LATEST_TAG }}-amd64 \
            ${{ env.DOCKER_IMAGE_CLASSIC }}:${{ env.LATEST_TAG }}-arm64v8 \
            ${{ env.DOCKER_IMAGE_CLASSIC }}:${{ env.LATEST_TAG }}-armv7

  cleanup-artifacts:
    name: Cleanup Artifacts
    needs: [docker-manifest, docker-manifest-classic]
    runs-on: ubuntu-24.04
    if: always() && !cancelled() && (needs.docker-manifest.result == 'success' || needs.docker-manifest-classic.result == 'success')
    permissions:
      actions: write
    steps:
      - name: Delete all run artifacts after Docker Hub push
        run: |
          echo "Cleaning up artifacts for run ${{ github.run_id }}..."
          gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
            --jq '.artifacts[].id' | while read -r artifact_id; do
              if [ -n "$artifact_id" ]; then
                echo "Deleting artifact ID: $artifact_id"
                gh api --method DELETE "repos/${{ github.repository }}/actions/artifacts/$artifact_id" || true
              fi
            done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
